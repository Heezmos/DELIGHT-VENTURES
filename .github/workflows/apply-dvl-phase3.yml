name: Apply Delight Ventures Website Phase 3
on:
  push:
    paths:
      - '.github/workflows/apply-dvl-phase3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Phase 3 website
        shell: bash
        run: |
          cat > /tmp/site.b64 <<'EOF'

EOF
          base64 -d /tmp/site.b64 | gunzip > index.html
      - name: Commit Phase 3 website
        shell: bash
        run: |
          git config user.name "dvl-automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Complete Phase 3 website and messaging UX"
          git push
