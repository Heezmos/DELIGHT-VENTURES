name: Build Premium DVL Interface
on:
  push:
    branches: [premium-interface-v2]
    paths: ['.github/workflows/premium-interface-v2.yml']
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-interface-v2
      - name: Transform premium interface
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Fail-safe: content is visible by default; animation only enhances supported pages.
          s=s.replace(".reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}", ".reveal{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease;}\n.js-reveal .reveal{opacity:0;transform:translateY(24px);}\n.js-reveal .reveal.visible{opacity:1;transform:translateY(0);}")
          # Premium hero: split copy + visual brand panel.
          s=s.replace("#hero{min-height:100vh;background:var(--dark);display:flex;align-items:center;\n  padding:120px 6% 80px;position:relative;overflow:hidden;}", "#hero{min-height:760px;background:var(--dark);display:flex;align-items:center;\n  padding:120px 6% 80px;position:relative;overflow:hidden;}")
          s=s.replace(".hero-inner{position:relative;z-index:2;max-width:820px;}", ".hero-inner{position:relative;z-index:2;width:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:64px;align-items:center;}\n.hero-copy{max-width:760px;}\n.hero-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:480px;position:relative;}\n.hero-brand::before{content:'';position:absolute;width:430px;height:430px;border-radius:50%;background:radial-gradient(circle,rgba(235,197,98,.18),rgba(192,144,79,.04) 55%,transparent 72%);filter:blur(2px);}\n.hero-brand img{position:relative;width:min(390px,88%);aspect-ratio:1;object-fit:contain;border-radius:50%;filter:drop-shadow(0 22px 45px rgba(0,0,0,.45));}\n.hero-brand p{position:relative;margin-top:24px;font-family:'EB Garamond',serif;color:var(--gold-light);font-size:17px;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;}\n.hero-kicker{font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:22px;}\n.hero-title{font-size:clamp(46px,5.3vw,78px)!important;line-height:1.04!important;}\n.hero-title em{display:inline!important;}\n.hero-desc{max-width:650px!important;font-size:18px!important;}\n.trust-strip{background:#fff;border-bottom:1px solid var(--border);padding:24px 6%;}\n.trust-inner{max-width:1320px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid rgba(192,144,79,.15);border-radius:16px;box-shadow:0 8px 28px rgba(38,25,14,.05);overflow:hidden;}\n.trust-item{padding:20px 24px;display:flex;gap:14px;align-items:center;border-right:1px solid rgba(192,144,79,.15);}\n.trust-item:last-child{border-right:0}.trust-icon{font-size:24px}.trust-item strong{display:block;font-family:'EB Garamond',serif;font-size:16px}.trust-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px}")
          # Add Home/Contact nav entries and preserve anchors.
          s=s.replace('<div class="nav-links">', '<div class="nav-links"><a href="#hero">Home</a>')
          s=s.replace('<a href="#why">Why Us</a>', '<a href="#why">Why Us</a><a href="#serve">Who We Serve</a><a href="#contact">Contact</a>')
          # Hero structure and finalized copy.
          marker='<div class="hero-inner">'
          if marker in s:
            s=s.replace(marker, marker+'\n    <div class="hero-copy">',1)
            close='</div>\n  <div class="hero-scroll">'
            brand='''</div>\n    <div class="hero-brand" aria-label="Delight Ventures Limited brand">\n      <img src="'''
            # reuse logo image source from nav
            import re
            m=re.search(r'<a href="#hero" class="logo">\s*<img src="([^"]+)"',s)
            logo=m.group(1) if m else ''
            brand += logo + '''" alt="Delight Ventures Limited emblem"/>\n      <p>Helping Businesses Launch. Digitize. Grow.</p>\n    </div>\n  </div>\n  <div class="hero-scroll">'''
            s=s.replace(close,brand,1)
          # Replace hero content while retaining premium markup.
          s=re.sub(r'<div class="hero-chip">.*?</div>\s*', '<div class="hero-kicker">Business Services &nbsp;|&nbsp; Digital Systems &nbsp;|&nbsp; Creative Media</div>\n', s, count=1, flags=re.S)
          s=re.sub(r'<h1 class="hero-title">.*?</h1>', '<h1 class="hero-title">We Launch. We Digitize.<br/>We <em>Grow</em> Your Business.</h1>', s, count=1, flags=re.S)
          s=re.sub(r'<div class="hero-tagline">.*?</div>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<p class="hero-desc">.*?</p>', '<p class="hero-desc">Delight Ventures Limited helps entrepreneurs, SMEs and organizations establish their businesses, implement practical digital solutions, and strengthen their market presence through professional creative media.</p>', s, count=1, flags=re.S)
          # Service heading: card-led reference direction.
          s=s.replace('Our Three Service Divisions', 'Three Divisions. End-to-End Impact.')
          # Add trust strip immediately after hero.
          hero_end='</section>\n\n<!-- ═══ ABOUT'
          trust='''</section>\n<section class="trust-strip" aria-label="Why businesses choose Delight Ventures">\n  <div class="trust-inner">\n    <div class="trust-item"><div class="trust-icon">◈</div><div><strong>Trusted Partner</strong><span>Reliable. Professional. Results.</span></div></div>\n    <div class="trust-item"><div class="trust-icon">◎</div><div><strong>Client-Focused</strong><span>Your goals guide our solutions.</span></div></div>\n    <div class="trust-item"><div class="trust-icon">◆</div><div><strong>Practical Solutions</strong><span>Built around real business needs.</span></div></div>\n    <div class="trust-item"><div class="trust-icon">▥</div><div><strong>Sustainable Growth</strong><span>Built for today. Ready for tomorrow.</span></div></div>\n  </div>\n</section>\n\n<!-- ═══ ABOUT'''
          s=s.replace(hero_end,trust,1)
          # Responsive premium hero and trust strip.
          s=s.replace('@media(max-width:900px){', '@media(max-width:900px){\n  .hero-inner{grid-template-columns:1fr;gap:36px}.hero-brand{min-height:360px}.hero-brand img{width:min(310px,75vw)}.trust-inner{grid-template-columns:1fr 1fr}.trust-item:nth-child(2){border-right:0}')
          s=s.replace('@media(max-width:600px){', '@media(max-width:600px){\n  #hero{padding-top:110px}.hero-brand{min-height:300px}.hero-brand img{width:min(260px,72vw)}.hero-brand p{font-size:12px;letter-spacing:2px}.trust-inner{grid-template-columns:1fr}.trust-item{border-right:0;border-bottom:1px solid rgba(192,144,79,.15)}.trust-item:last-child{border-bottom:0}')
          # Progressive enhancement: activate reveal only if IntersectionObserver exists.
          s=s.replace('// Scroll reveal\nconst obs = new IntersectionObserver', "// Scroll reveal — progressive enhancement; content stays visible if JS/observer fails\nif ('IntersectionObserver' in window) document.documentElement.classList.add('js-reveal');\nconst obs = new IntersectionObserver")
          p.write_text(s)
      - name: Commit premium interface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build premium DVL interface from approved visual direction' || exit 0
          git push origin premium-interface-v2
