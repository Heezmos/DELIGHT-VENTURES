name: Build Business Compliance Service Flow
on:
  push:
    branches: [business-compliance-service-flow]
    paths: ['.github/workflows/business-compliance-flow.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: business-compliance-service-flow
      - name: Apply exact-service customer journey
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* BUSINESS COMPLIANCE SERVICE FLOW */'
          css=base64.b64decode('').decode()
          js=base64.b64decode('').decode()
          if marker not in s:
            s=s.replace('</style>',css+'\n</style>',1)
            s=s.replace('</script>',js+'\n</script>',1)
            p.write_text(s,encoding='utf-8')
          required=[marker,'BUSINESS_SERVICES','business-registration','tax-registration','nassit-setup','licensing-support','business-consultancy']
          missing=[x for x in required if x not in s]
          if missing: raise RuntimeError('Missing Business Compliance flow markers: '+', '.join(missing))
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build exact Business Compliance service journey' || exit 0
          git push origin business-compliance-service-flow