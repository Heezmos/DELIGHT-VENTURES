name: Apply Delight Ventures Website v2
on:
  push:
    paths:
      - '.github/workflows/apply-dvl-website-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write refined website
        shell: bash
        run: |
          cat > /tmp/site.b64 <<'EOF'

EOF
          base64 -d /tmp/site.b64 | gunzip > index.html
      - name: Commit website update
        shell: bash
        run: |
          git config user.name "dvl-automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine public website and remove internal Delight Hub references"
          git push
