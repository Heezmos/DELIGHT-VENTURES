name: Build DVL Phase 2 Service Experience

on:
  push:
    branches:
      - phase-2-service-experience
    paths:
      - .github/workflows/phase-2-services.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-service-experience

      - name: Apply service experience
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* PHASE 2 SERVICE EXPERIENCE */'
          if marker not in s:
              css='''/* PHASE 2 SERVICE EXPERIENCE */
          .service-actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.service-detail-btn{border:1px solid rgba(192,144,79,.38);background:transparent;color:var(--gold-light);padding:11px 16px;border-radius:6px;font:inherit;cursor:pointer}.service-request-btn{display:inline-flex;align-items:center;text-decoration:none;background:var(--gold);color:var(--dark);padding:11px 16px;border-radius:6px;font-weight:700;font-size:13px}.service-modal{position:fixed;inset:0;z-index:1000;background:rgba(20,13,8,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px}.service-modal.open{display:flex}.service-modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--cream);border:1px solid rgba(192,144,79,.35);border-radius:18px;padding:38px;position:relative}.service-modal-close{position:absolute;right:20px;top:18px;border:0;background:transparent;font-size:28px;cursor:pointer}.service-modal-kicker{text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-size:11px;font-weight:700}.service-modal h3{font-family:'EB Garamond',serif;font-size:34px;margin:8px 42px 10px 0}.service-modal p{color:var(--muted);line-height:1.7}.service-modal ul{margin:22px 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}.service-modal li{padding:11px 13px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:13px}.service-modal li:before{content:'✓';color:var(--gold);font-weight:800;margin-right:9px}.service-modal-footer{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}.service-modal-note{font-size:12px!important;margin:0!important;flex:1;min-width:230px}@media(max-width:600px){.service-modal-card{padding:28px 20px}.service-modal ul{grid-template-columns:1fr}.service-modal h3{font-size:28px}}'''
              s=s.replace('</style>',css+'\n</style>',1)
              labels=['Business & Compliance Services','Digital Solutions & Systems','Creative Media Services']
              keys=['business','digital','creative']
              for label,key in zip(labels,keys):
                  pos=s.find(label)
                  if pos<0: raise RuntimeError('Missing '+label)
                  nxt=s.find('<div class="pillar',pos+len(label))
                  end=nxt if nxt>=0 else s.find('</section>',pos)
                  chunk=s[pos:end]
                  if 'data-service-modal=' not in chunk:
                      idx=chunk.rfind('</div>')
                      actions=f'<div class="service-actions"><button type="button" class="service-detail-btn" data-service-modal="{key}">Explore Services</button><a href="#contact" class="service-request-btn" data-request-division="{key}">Request Service →</a></div>'
                      chunk=chunk[:idx]+actions+chunk[idx:]
                      s=s[:pos]+chunk+s[end:]
              modal='''<div class="service-modal" id="serviceModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="serviceModalTitle"><div class="service-modal-card"><button class="service-modal-close" type="button" aria-label="Close service details">×</button><div class="service-modal-kicker" id="serviceModalKicker"></div><h3 id="serviceModalTitle"></h3><p id="serviceModalIntro"></p><ul id="serviceModalList"></ul><div class="service-modal-footer"><a href="#contact" class="service-request-btn" id="modalRequestBtn">Request This Service →</a><p class="service-modal-note">Tell us what you need. DVL will review your request and follow up with the appropriate next steps.</p></div></div></div>'''
              s=s.replace('</body>',modal+'\n</body>',1)
              js='''
          const DVL_SERVICES={business:{kicker:'Launch',title:'Business & Compliance Services',intro:'Practical administrative and advisory support to help entrepreneurs and organizations establish and maintain stronger business foundations.',items:['Business Registration','Tax Registration','NASSIT Setup','Business Licensing Support','Business Consultancy']},digital:{kicker:'Digitize',title:'Digital Solutions & Systems',intro:'Practical digital products and operational systems designed around the needs of startups, SMEs and organizations.',items:['Corporate Websites','E-Commerce Platforms','ERP Systems','CRM Systems','HRM Systems','Payment Gateway Integration','Inventory Management Systems','WhatsApp Business Integration']},creative:{kicker:'Grow',title:'Creative Media Services',intro:'Professional visual content that helps businesses present their brands, products, people and activities with greater credibility and market visibility.',items:['Corporate Photography & Videography','Event Coverage','Product Photography & Videography','Promotional Content','Commercial Visuals']}};
          const serviceModal=document.getElementById('serviceModal');
          function selectDVLService(key){const d=DVL_SERVICES[key];if(!d||!serviceModal)return;document.getElementById('serviceModalKicker').textContent=d.kicker;document.getElementById('serviceModalTitle').textContent=d.title;document.getElementById('serviceModalIntro').textContent=d.intro;document.getElementById('serviceModalList').innerHTML=d.items.map(x=>`<li>${x}</li>`).join('');document.getElementById('modalRequestBtn').dataset.requestDivision=key;serviceModal.classList.add('open');serviceModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
          function closeDVLService(){if(!serviceModal)return;serviceModal.classList.remove('open');serviceModal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
          document.querySelectorAll('[data-service-modal]').forEach(b=>b.addEventListener('click',()=>selectDVLService(b.dataset.serviceModal)));document.querySelector('.service-modal-close')?.addEventListener('click',closeDVLService);serviceModal?.addEventListener('click',e=>{if(e.target===serviceModal)closeDVLService()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDVLService()});
          function prefillDVLRequest(key){const d=DVL_SERVICES[key];if(!d)return;const form=document.querySelector('#contact form, form.contact-form, #contactForm');if(!form)return;const select=form.querySelector('select');if(select){const options=[...select.options];const match=options.find(o=>o.textContent.toLowerCase().includes(d.title.split(' Services')[0].toLowerCase())||o.value.toLowerCase().includes(key));if(match)select.value=match.value}const msg=form.querySelector('textarea');if(msg&&!msg.value.trim())msg.value=`I am interested in ${d.title}. Please contact me to discuss my requirements.`}
          document.querySelectorAll('[data-request-division]').forEach(a=>a.addEventListener('click',()=>{const key=a.dataset.requestDivision;closeDVLService();prefillDVLRequest(key)}));'''
              s=s.replace('</script>',js+'\n</script>',1)
              p.write_text(s,encoding='utf-8')
          required=[marker,'data-service-modal="business"','data-service-modal="digital"','data-service-modal="creative"','id="serviceModal"','const DVL_SERVICES=']
          missing=[x for x in required if x not in s]
          if missing: raise RuntimeError('Verification failed: '+', '.join(missing))
          PY

      - name: Commit implementation
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build Phase 2 DVL service request experience'
          git push origin HEAD:phase-2-service-experience
