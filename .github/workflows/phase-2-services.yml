name: Finalize DVL Phase 2 Service Experience
on:
  push:
    branches: [phase-2-service-experience]
    paths: [.github/workflows/phase-2-services.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-service-experience
      - name: Finalize modal execution order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          modal='''<div class="service-modal" id="serviceModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="serviceModalTitle"><div class="service-modal-card"><button class="service-modal-close" type="button" aria-label="Close service details">×</button><div class="service-modal-kicker" id="serviceModalKicker"></div><h3 id="serviceModalTitle"></h3><p id="serviceModalIntro"></p><ul id="serviceModalList"></ul><div class="service-modal-footer"><a href="#contact" class="service-request-btn" id="modalRequestBtn">Request This Service →</a><p class="service-modal-note">Tell us what you need. DVL will review your request and follow up with the appropriate next steps.</p></div></div></div>'''
          after='</script>\n'+modal
          if after in s:
              s=s.replace(after,'</script>',1)
              s=s.replace('<script>',modal+'\n<script>',1)
          if s.find('id="serviceModal"') > s.find('<script>'): raise RuntimeError('Service modal must exist before script execution')
          if 'const DVL_SERVICES=' not in s: raise RuntimeError('Service logic missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final Phase 2 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize Phase 2 service interaction order'
          git push origin HEAD:phase-2-service-experience
