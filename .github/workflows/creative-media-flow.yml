name: Build Creative Media Service Flow

on:
  push:
    branches: [creative-media-service-flow]
    paths: [.github/workflows/creative-media-flow.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: creative-media-service-flow
      - name: Apply Creative Media journey
        run: python -c "import base64;exec(base64.b64decode('ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCnA9UGF0aCgiaW5kZXguaHRtbCIpCnM9cC5yZWFkX3RleHQoZW5jb2Rpbmc9InV0Zi04IikKbWFya2VyPSIvKiBDUkVBVElWRSBNRURJQS BTRVJWSUNFIEZMT1cgKi8i'.replace(' ','')))"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build exact Creative Media service journey" || exit 0
          git push origin creative-media-service-flow
