name: Build Digital Solutions Service Flow
on:
  push:
    branches: [digital-solutions-service-flow]
    paths: ['.github/workflows/digital-solutions-flow.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: digital-solutions-service-flow
      - name: Apply exact digital service customer journey
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DIGITAL SOLUTIONS SERVICE FLOW */'
          if marker not in s:
            css=Path('tmp/digital-flow.css').read_text(encoding='utf-8')
            js=Path('tmp/digital-flow.js').read_text(encoding='utf-8')
            s=s.replace('</style>',css+'\n</style>',1)
            s=s.replace('</script>',js+'\n</script>',1)
            p.write_text(s,encoding='utf-8')
          required=[marker,'DIGITAL_SERVICES','corporate-websites','ecommerce-platforms','erp-systems','crm-systems','hrm-systems','payment-integration','inventory-systems','whatsapp-integration']
          missing=[x for x in required if x not in s]
          if missing:
            raise RuntimeError('Missing Digital Solutions flow markers')
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build exact Digital Solutions service journey' || exit 0
          git push origin digital-solutions-service-flow
