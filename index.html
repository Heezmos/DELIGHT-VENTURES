<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Delight Ventures Limited — Helping Businesses Launch, Digitize & Grow</title>
<meta name="description" content="Delight Ventures Limited helps entrepreneurs, startups, SMEs and organizations launch, digitize and grow through business and compliance services, digital solutions and creative media."/>
<meta name="theme-color" content="#1A0F06"/>
<style>html,body{margin:0;background:#1A0F06;color:#F7F0E4;font-family:Georgia,serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot strong{color:#EBC562;font-size:28px}.boot p{opacity:.65;max-width:520px;line-height:1.6}</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Delight Ventures Limited</strong><p>Helping Businesses Launch, Digitize & Grow.</p></div></div>
<script>
(async()=>{
  try{
    const res=await fetch('/dvl-rebranded.html',{cache:'no-store'});
    if(!res.ok) throw new Error('Unable to load website');
    let html=await res.text();
    const replacements=[
      ['Delight Ventures Limited — Build. Digitize. Elevate.','Delight Ventures Limited — Helping Businesses Launch, Digitize & Grow'],
      ['Build · Digitize · Elevate','Helping Businesses Launch · Digitize · Grow'],
      ['Build. Digitize. Elevate.','Helping Businesses Launch, Digitize & Grow.'],
      ['Our Three Service Pillars','Our Services'],
      ['Three integrated pillars that take businesses from legal establishment through digital transformation to a powerful brand presence — all from one trusted partner.','Three connected service divisions designed to help businesses establish strong foundations, digitize their operations, and strengthen their market presence — all through one trusted partner.'],
      ['<div class="pillar-word">Build</div>','<div class="pillar-word">Launch</div>'],
      ['<div class="pillar-word">Digitize</div>','<div class="pillar-word">Digitize</div>'],
      ['<div class="pillar-word">Elevate</div>','<div class="pillar-word">Grow</div>'],
      ['Business Registration &amp; Compliance','Business &amp; Compliance Services'],
      ['Websites, Ecommerce &amp; Business Systems','Digital Solutions &amp; Systems'],
      ['Photography &amp; Videography','Creative Media Services'],
      ['Website &amp; Ecommerce Setup','Digital Solutions &amp; Systems'],
      ['ERP / CRM / Business Systems','Digital Solutions &amp; Systems'],
      ['Ready to build, digitize, or elevate your business?','Ready to launch, digitize, or grow your business?'],
      ['enhancing your brand, Delight Ventures Limited is here to help you Build. Digitize. Elevate.','strengthening your market presence, Delight Ventures Limited is here to help you launch, digitize, and grow.'],
      ['A business and digital solutions company empowering entrepreneurs, SMEs, and organizations in Sierra Leone and across Africa.','A business solutions company helping entrepreneurs, SMEs, and organizations launch, digitize, and grow through business support, digital systems, and creative media services.']
    ];
    replacements.forEach(([a,b])=>{html=html.split(a).join(b)});
    html=html.replace('<h2 class="sec-title">Helping Businesses Launch, Digitize & Grow.</h2>','<h2 class="sec-title">Three Service Divisions. One Business Partner.</h2>');
    html=html.replace('Empowering entrepreneurs, startups, SMEs, and organizations to establish, transform, and grow their businesses through innovative technology, business consultancy, and creative media.','Helping entrepreneurs, startups, SMEs, and organizations establish their businesses, digitize operations, and strengthen their market presence through business support, technology, and professional creative media.');
    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<div><strong>Delight Ventures Limited</strong><p>We are updating our website. Please contact us at info@delightventures.com or +232 31 556611.</p></div>';
  }
})();
</script>
</body>
</html>
